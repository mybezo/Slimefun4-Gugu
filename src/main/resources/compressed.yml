# Compressed Machine & Electric
# A compressed machine combines multiple machines into one (x8, x16, x32 or x64).
#
# How they work:
#   Machines    - process up to N recipes at once with the inputs that are available,
#                 at the same speed as the original. Energy is only used for what is processed.
#   Generators  - burn up to N fuel units at once and produce the energy of all of them.
#   Solar       - produce N times the energy.
#   Reactors    - burn up to N fuel units at once: N times the energy, coolant and byproducts.
#   Capacitors  - hold N times the energy.
#
# Recipes (Compressor):
#   x8  = 8 of the original
#   x16 = 2 of the x8 version
#   x32 = 2 of the x16 version
#   x64 = 2 of the x32 version
#
# Changes require a server restart.
# Missing options are added automatically, existing values are kept.

# Enable/disable all the compressed machines
enabled: true

# Enable/disable each multiplier.
# Disabling a multiplier also disables all the multipliers above it,
# because their recipes need the previous multiplier.
multipliers:
  x8: true
  x16: true
  x32: true
  x64: true

# Enable/disable the compressed versions (all multipliers) of each item, by the ID of the original item
